<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10191e">
  <title>管理中心 · 灵瞳勘顶 StrataEye</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/strata-theme.css">
  <link rel="preload" href="assets/fonts/strata-sans-sc.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="images/strataeye-mark.svg">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-head">
      <div class="admin-head-text">
        <p class="admin-kicker">灵瞳勘顶 StrataEye</p>
        <h1>超级管理员中心</h1>
        <p class="admin-sub">账户、角色与审计日志</p>
      </div>
      <div class="admin-actions">
        <button class="admin-btn" id="refreshBtn">刷新</button>
        <button class="admin-btn" id="logoutBtn">退出登录</button>
      </div>
    </header>
    <div id="status" class="admin-status" role="status" aria-live="polite"></div>
    <section class="admin-grid">
      <div class="admin-panel admin-users">
        <h2>用户账户</h2>
        <div id="usersWrap" class="table-wrap admin-loading">正在读取...</div>
      </div>
      <div class="admin-panel">
        <h2>创建账户</h2>
        <form id="createForm">
          <div class="form-row full">
            <label><span class="field-label">登录邮箱</span><input name="username" type="email" autocomplete="off" spellcheck="false" required></label>
          </div>
          <div class="form-row">
            <label><span class="field-label">显示名称</span><input name="displayName" required></label>
            <label><span class="field-label">所属组织</span><input name="organization"></label>
          </div>
          <div class="form-row">
            <label><span class="field-label">初始密码</span><input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
            <label><span class="field-label">角色</span>
            <select name="role">
              <option value="enterprise">企业端</option>
              <option value="regulator">监管端</option>
              <option value="expert">智库端</option>
              <option value="viewer" selected>只读用户</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="admin-btn primary" type="submit">创建账户</button>
          </div>
        </form>
      </div>
      <div class="admin-panel">
        <h2>最近审计日志</h2>
        <div id="logsWrap" class="admin-loading">正在读取...</div>
      </div>
    </section>
  </main>
  <dialog id="resetDialog" class="admin-dialog">
    <form id="resetForm" class="dialog-body">
      <h2>重置账户密码</h2>
      <p id="resetTarget"></p>
      <label for="resetPassword" class="field-label">新密码（至少 8 位）</label>
      <input id="resetPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <div class="dialog-actions">
        <button class="admin-btn" id="cancelReset" type="button">取消</button>
        <button class="admin-btn primary" type="submit">确认重置</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
