<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10191e">
  <title>登录 · 灵瞳勘顶 StrataEye</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/strata-theme.css">
  <link rel="preload" href="assets/fonts/strata-sans-sc.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="images/strataeye-mark.svg">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="mine-identity" aria-labelledby="systemTitle">
      <div class="brand-mark">
        <img src="images/strataeye-mark.svg" alt="" aria-hidden="true" width="44" height="44">
        <span>StrataEye<small>顶板风险研判与协同决策</small></span>
      </div>
      <div class="title-block">
        <p class="title-kicker"><span></span> 让风险可见，让决策有据</p>
        <h1 id="systemTitle">
          <span class="title-main">灵瞳勘顶</span>
          <span class="title-sub">煤矿顶板灾变智能预警<br>与多智能体协同决策系统</span>
        </h1>
        <p class="title-en">连接井下空间、监测证据与现场处置，<br>在同一工作台完成风险研判与协同复核。</p>
      </div>
      <div class="scene-caption" aria-hidden="true">
        <span>三维空间感知</span>
        <i></i>
        <span>模型风险识别</span><i></i><span>三端协同复核</span>
      </div>
    </section>

    <section class="access-panel" aria-labelledby="loginTitle">
      <div class="access-status"><span></span> 身份认证服务在线</div>
      <div class="access-heading">
        <p>统一访问入口</p>
        <h2 id="loginTitle">登录系统</h2>
        <div class="access-description">使用工作账号登录，进入对应的业务工作台。</div>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="username">账号</label>
          <div class="field-control">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" maxlength="64" placeholder="请输入账号…" required>
          </div>
        </div>

        <div class="field-group">
          <label for="password">密码</label>
          <div class="field-control">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码…" required>
            <button class="password-toggle" id="togglePassword" type="button" aria-label="显示密码" title="显示密码" aria-pressed="false">
              <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.1 12a10.8 10.8 0 0 1 19.8 0 10.8 10.8 0 0 1-19.8 0Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m2 2 20 20M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A11 11 0 0 1 22 12a10.8 10.8 0 0 1-2 3M6.6 6.6A11.6 11.6 0 0 0 2 12a10.8 10.8 0 0 0 14.1 6.1"/></svg>
            </button>
          </div>
        </div>

        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>

        <button class="login-submit" id="loginSubmit" type="submit">
          <span>进入系统</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </form>

      <footer class="access-footer">
        <span>灵瞳勘顶 StrataEye</span>
        <span>会话受安全保护</span>
      </footer>
    </section>
  </main>
  <script src="js/login.js" defer></script>
</body>
</html>
